[project]
name = "atlas"
version = "0.1.0"
description = "Personal knowledge-centric AI agent system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "pypdf>=6.14.2",
    "beautifulsoup4>=4.15.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.2",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "trafilatura>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Headless browser automation (S20e). Heavy + needs `playwright install <browser>`, so
# it is optional: the browser capability degrades gracefully when it is not installed.
browser = [
    "playwright>=1.40",
]
# BA.v2 media obtain (policy-gated). Optional — Atlas boots without it; enable
# ``plugins.youtube.media_obtain_enabled`` when the binary is available.
media = [
    "yt-dlp>=2024.4.9",
]
# M.5 / OI-STT0: optional local speech_to_text. Prefer CPU torch first to avoid
# multi‑GB CUDA wheels::
#   uv pip install torch --index-url https://download.pytorch.org/whl/cpu
#   uv sync --extra speech
# Then set ``plugins.speech.enabled: true`` (see config/local.yaml).
speech = [
    "openai-whisper>=20231117",
]

[project.scripts]
atlas = "atlas.cli.main:main"
atlas-db = "atlas.database.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
